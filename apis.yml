description: Somite (now operating as Cellular Intelligence) is an AI-native TechBio company
  backed by Khosla Ventures building a universal virtual cell-signaling foundation model to
  engineer cellular fate. In 2026 the company rebranded from Somite to Cellular Intelligence and
  entered an agreement with Novo Nordisk to advance STEM-PD, a clinical-stage cell therapy for
  Parkinson's disease that carries FDA Fast Track Designation. The company works at the intersection
  of machine learning and regenerative medicine and does not currently publish a public developer API,
  documentation, SDKs, or other machine-readable API surface.
